name: Spring Boot 51463 reproducer

on:
  workflow_dispatch:
  push:
    branches:
      - investigate-51463-nested-jar-stall
    paths:
      - '.github/workflows/spring-boot-51463-reproducer.yml'
      - '.github/reproducers/gh-51463/**'
      - 'loader/spring-boot-loader/src/test/java/org/springframework/boot/loader/jar/NestedJarFileFileAccessLockConvoyTests.java'
      - 'loader/spring-boot-loader/src/test/java/org/springframework/boot/loader/jar/NestedJarFileFileAccessLockConvoyRegressionTests.java'
      - 'loader/spring-boot-loader/src/test/java/org/springframework/boot/loader/net/protocol/jar/JarUrlClassLoaderVirtualThreadStressTests.java'

permissions:
  contents: read

jobs:
  regression-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify current baseline fails for the lock-convoy assertion
        shell: bash
        run: |
          set -o pipefail
          rm -rf loader/spring-boot-loader/build/test-results/test
          set +e
          ./gradlew :loader:spring-boot-loader:test \
            --tests org.springframework.boot.loader.jar.NestedJarFileFileAccessLockConvoyRegressionTests \
            --rerun-tasks \
            --no-daemon \
            --stacktrace 2>&1 | tee gh-51463-baseline-regression.log
          baseline_status=${PIPESTATUS[0]}
          set -e
          if [ "$baseline_status" -eq 0 ]; then
            echo 'Expected current NestedJarFile baseline to fail the gh-51463 regression contract, but it passed.'
            exit 1
          fi
          if ! grep -R -F -q \
            'GH-51463 regression: independent NestedJarFile metadata reads must not wait behind a stalled FileAccess read' \
            loader/spring-boot-loader/build/test-results/test; then
            echo 'Baseline failed, but not for the expected gh-51463 lock-convoy assertion.'
            exit 1
          fi
          echo 'BASELINE-FAIL CONFIRMED: independent metadata read is serialized behind stalled FileAccess work.'
      - name: Apply temporary causal probe to NestedJarFile read path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('loader/spring-boot-loader/src/main/java/org/springframework/boot/loader/jar/NestedJarFile.java')
          text = path.read_text()
          old = """\t\tsynchronized (this) {
          \t\t\tensureOpen();
          \t\t\treturn this.resources.zipContent().hasEntry(null, name);
          \t\t}
          """
          new = """\t\tensureOpen();
          \t\treturn this.resources.zipContent().hasEntry(null, name);
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one hasEntry synchronized block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- loader/spring-boot-loader/src/main/java/org/springframework/boot/loader/jar/NestedJarFile.java
      - name: Verify the same regression contract passes with the temporary probe
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :loader:spring-boot-loader:test \
            --tests org.springframework.boot.loader.jar.NestedJarFileFileAccessLockConvoyRegressionTests \
            --rerun-tasks \
            --no-daemon \
            --stacktrace 2>&1 | tee gh-51463-patched-regression.log
          echo 'PATCHED-PASS CONFIRMED: removing the outer hasEntry monitor breaks the lock convoy.'
      - name: Restore production source
        if: always()
        shell: bash
        run: |
          git checkout -- loader/spring-boot-loader/src/main/java/org/springframework/boot/loader/jar/NestedJarFile.java
          if ! git diff --quiet -- loader/spring-boot-loader/src/main/java/org/springframework/boot/loader/jar/NestedJarFile.java; then
            echo 'NestedJarFile.java was not restored cleanly.'
            git diff -- loader/spring-boot-loader/src/main/java/org/springframework/boot/loader/jar/NestedJarFile.java
            exit 1
          fi
      - name: Upload regression-contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-51463-regression-contract
          path: |
            gh-51463-baseline-regression.log
            gh-51463-patched-regression.log
          if-no-files-found: warn

  causal-lock-convoy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Demonstrate FileAccess to NestedJarFile lock convoy
        run: >-
          ./gradlew :loader:spring-boot-loader:test
          --tests org.springframework.boot.loader.jar.NestedJarFileFileAccessLockConvoyTests
          --no-daemon
          --info

  loader-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Run nested JAR virtual-thread stress reproducer
        env:
          SPRING_BOOT_GH51463_STRESS: 'true'
        run: >-
          ./gradlew :loader:spring-boot-loader:test
          --tests org.springframework.boot.loader.net.protocol.jar.JarUrlClassLoaderVirtualThreadStressTests
          --no-daemon
          --stacktrace

  production-shape-reproducer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Generate large nested and loader.path archives
        working-directory: .github/reproducers/gh-51463
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          nested = Path('load-libs')
          external = Path('loader-path')
          nested.mkdir(exist_ok=True)
          external.mkdir(exist_ok=True)
          payload = bytes(range(256)) * 2048
          common = bytes(range(256)) * 256

          for jar_index in range(96):
              jar = nested / f'load-dependency-{jar_index:03d}.jar'
              with zipfile.ZipFile(jar, 'w', compression=zipfile.ZIP_STORED) as out:
                  out.writestr('META-INF/gh-51463/common.dat', common)
                  for entry_index in range(32):
                      out.writestr(
                          f'load/{jar_index:03d}/entry-{entry_index:03d}.dat',
                          bytes([(jar_index + entry_index) & 0xff]),
                      )
                  out.writestr(f'load/{jar_index:03d}/payload.bin', payload)

          for jar_index in range(24):
              jar = external / f'external-dependency-{jar_index:03d}.jar'
              with zipfile.ZipFile(jar, 'w', compression=zipfile.ZIP_STORED) as out:
                  out.writestr('META-INF/gh-51463/common.dat', common)
                  out.writestr(f'external/{jar_index:03d}/payload.bin', payload)
          PY
          du -sh load-libs loader-path
      - name: Build PropertiesLauncher executable reproducer
        run: ./gradlew -p .github/reproducers/gh-51463 clean bootJar --no-daemon --stacktrace
      - name: Exercise production-shaped startup and capture structural evidence
        shell: bash
        run: |
          set -u
          APP='.github/reproducers/gh-51463/build/libs/gh-51463-reproducer.jar'
          LOADER_PATH="$GITHUB_WORKSPACE/.github/reproducers/gh-51463/loader-path/"
          DIAG="$GITHUB_WORKSPACE/gh-51463-diagnostics"
          ANALYZER="$GITHUB_WORKSPACE/.github/reproducers/gh-51463/analyze_dumps.py"
          mkdir -p "$DIAG"
          ls -lh "$APP" | tee "$DIAG/jar-size.txt"
          java -version 2> "$DIAG/java-version.txt"
          echo "loader.path=$LOADER_PATH" > "$DIAG/launcher.txt"

          capture_jcmd() {
            local pid="$1"
            local output="$2"
            shift 2
            local status=0
            timeout --signal=TERM --kill-after=2s 10s jcmd "$pid" "$@" > "$output" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              echo "jcmd failed or timed out: pid=$pid status=$status command=$*" | tee -a "$DIAG/jcmd-errors.txt"
            fi
            return "$status"
          }

          terminate_pid() {
            local pid="$1"
            local label="$2"
            local grace_seconds="${3:-5}"
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" 2>/dev/null || true
              return
            fi
            kill -TERM "$pid" 2>/dev/null || true
            if ! timeout "${grace_seconds}s" tail --pid="$pid" -f /dev/null > /dev/null 2>&1; then
              echo "$label pid $pid did not exit after ${grace_seconds}s; sending SIGKILL" | tee -a "$DIAG/cleanup.txt"
              kill -KILL "$pid" 2>/dev/null || true
              timeout 2s tail --pid="$pid" -f /dev/null > /dev/null 2>&1 || true
            fi
            wait "$pid" 2>/dev/null || true
          }

          cleanup() {
            local pid="${1:-}"
            shift || true
            for worker in "$@"; do
              terminate_pid "$worker" worker 2
            done
            if [ -n "$pid" ]; then
              terminate_pid "$pid" application 5
            fi
          }

          reproduced=0
          for attempt in $(seq 1 3); do
            port=$((18080 + attempt))
            log="$DIAG/application-${attempt}.log"
            echo "=== attempt $attempt port $port ===" | tee -a "$DIAG/attempts.txt"
            java -Dloader.path="$LOADER_PATH" -jar "$APP" --server.port="$port" > "$log" 2>&1 &
            pid=$!

            workers=()
            for worker_index in $(seq 1 24); do
              (
                request=0
                while kill -0 "$pid" 2>/dev/null; do
                  case $((request % 3)) in
                    0) path='/probe' ;;
                    1) path='/actuator/health' ;;
                    2) path='/actuator/prometheus' ;;
                  esac
                  curl -fsS --max-time 3 "http://127.0.0.1:${port}${path}" > /dev/null 2>&1 || true
                  request=$((request + 1))
                done
              ) &
              workers+=("$!")
            done

            for snapshot in $(seq 1 18); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "application exited during snapshot window" | tee -a "$DIAG/attempts.txt"
                break
              fi
              sleep 5
              curl -fsS --max-time 2 "http://127.0.0.1:${port}/progress" \
                > "$DIAG/progress-${attempt}-${snapshot}.txt" 2>/dev/null || true
              capture_jcmd "$pid" "$DIAG/jcmd-thread-${attempt}-${snapshot}.log" \
                Thread.dump_to_file -format=json "$DIAG/thread-${attempt}-${snapshot}.json" || true
            done

            analysis_status=0
            python3 "$ANALYZER" "$DIAG" | tee "$DIAG/analysis-${attempt}.txt" || analysis_status=$?
            if [ "$analysis_status" -eq 2 ]; then
              echo "REPRODUCED: persistent FileDataBlock/NestedJarFile signature" | tee -a "$DIAG/attempts.txt"
              capture_jcmd "$pid" "$DIAG/final-thread-${attempt}.txt" Thread.print -l || true
              capture_jcmd "$pid" "$DIAG/vm-${attempt}.txt" VM.info || true
              reproduced=1
            else
              echo "No production signature in attempt $attempt" | tee -a "$DIAG/attempts.txt"
            fi

            cleanup "$pid" "${workers[@]}"
            [ "$reproduced" -eq 1 ] && break
          done

          if [ "$reproduced" -eq 1 ]; then
            echo 'gh-51463 production-shaped failure signature reproduced'
            echo '### GH-51463 baseline production-shape reproduction: CONFIRMED' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'No production-shaped gh-51463 signature reproduced in three attempts'
          echo '### GH-51463 baseline production-shape reproduction: NOT REPRODUCED' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Upload reproduction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-51463-production-shape-diagnostics
          path: gh-51463-diagnostics
          if-no-files-found: warn
